<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <title>Web-GIS Kabupaten Bandung & Sleman</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .legend {
            max-height: 220px;
            overflow-y: auto;
        }

        /* Styling khusus untuk Legenda Kustom Penduduk Sleman */
        .custom-legend {
            background: white;
            padding: 10px 14px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 20px;
            color: #333;
        }

        .custom-legend h4 {
            margin: 0 0 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .legend-circle {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
            border: 1px solid #fff;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="lib/L.Geoserver.js"></script>

    <script>
        var map = L.map("map").setView([-7.75, 110.30], 11);

        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });
        osm.addTo(map);

        // Layer 1: Batas Kecamatan Kab. Bandung
        var wmsLayer1 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:Batas_kecamatan_kab.bandung",
            transparent: true,
        });
        wmsLayer1.addTo(map);

        // Layer 2: Sungai Kab. Bandung
        var wmsLayer2 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:sungai_kab_bandung",
            transparent: true,
        });
        wmsLayer2.addTo(map);

        // Layer 3: Penduduk Sleman (Simbologi Bertingkat)
        var wfsLayer3 = L.layerGroup().addTo(map);

        $.getJSON("get_data.php", function (data) {
            L.geoJSON(data, {
                pointToLayer: function (feature, latlng) {
                    var penduduk = feature.properties.jumlah_penduduk;
                    var warna = "#2ecc71"; // Hijau (< 40.000)

                    if (penduduk > 60000) {
                        warna = "#e74c3c"; // Merah (> 60.000)
                    } else if (penduduk > 40000) {
                        warna = "#f1c40f"; // Kuning (40.000 - 60.000)
                    }

                    return L.circleMarker(latlng, {
                        radius: 8,
                        fillColor: warna,
                        color: "#ffffff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: function (feature, layer) {
                    var props = feature.properties;
                    var popupContent = `
                        <b>Kecamatan:</b> ${props.kecamatan}<br>
                        <b>Luas:</b> ${props.luas} km²<br>
                        <b>Jumlah Penduduk:</b> ${props.jumlah_penduduk} jiwa<br>
                        <b>Koordinat:</b> ${props.latitude}, ${props.longitude}
                    `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(wfsLayer3);
        });

        // Legenda 1: Batas Kecamatan
        var layerLegend1 = L.Geoserver.legend("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:Batas_kecamatan_kab.bandung",
        });
        layerLegend1.addTo(map);

        // Legenda 2: Sungai Kab. Bandung
        var layerLegend2 = L.Geoserver.legend("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:sungai_kab_bandung",
        });
        layerLegend2.addTo(map);

        // Legenda 3: Legenda Kustom Bertingkat (Menggantikan legenda bawaan GeoServer)
        var layerLegend3 = L.control({ position: "bottomleft" });

        layerLegend3.onAdd = function (map) {
            var div = L.DomUtil.create("div", "custom-legend");
            div.innerHTML = `
                <h4>Jumlah Penduduk Sleman</h4>
                <div><span class="legend-circle" style="background: #2ecc71;"></span> &lt; 40.000 jiwa</div>
                <div><span class="legend-circle" style="background: #f1c40f;"></span> 40.000 - 60.000 jiwa</div>
                <div><span class="legend-circle" style="background: #e74c3c;"></span> &gt; 60.000 jiwa</div>
            `;
            return div;
        };
        layerLegend3.addTo(map);

        var baseMaps = {
            "OpenStreetMap": osm
        };

        var overlayMaps = {
            "Batas Kecamatan": wmsLayer1,
            "Sungai": wmsLayer2,
            "Penduduk Sleman": wfsLayer3
        };

        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // Event listener agar legenda otomatis mengikuti status Layer Control
        map.on("overlayadd", function (eventLayer) {
            if (eventLayer.name === "Batas Kecamatan") {
                layerLegend1.addTo(map);
            } else if (eventLayer.name === "Sungai") {
                layerLegend2.addTo(map);
            } else if (eventLayer.name === "Penduduk Sleman") {
                layerLegend3.addTo(map);
            }
        });

        map.on("overlayremove", function (eventLayer) {
            if (eventLayer.name === "Batas Kecamatan") {
                map.removeControl(layerLegend1);
            } else if (eventLayer.name === "Sungai") {
                map.removeControl(layerLegend2);
            } else if (eventLayer.name === "Penduduk Sleman") {
                map.removeControl(layerLegend3);
            }
        });
    </script>
</body>

</html>
